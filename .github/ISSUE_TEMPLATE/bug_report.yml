name: Bug report
description: Something in MetalVR does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a game that does not work, use the **Game report** form instead: it asks for what is needed to reproduce a game.
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
      description: The steps that lead to it, as exactly as you can.
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Which path
      options:
        - Windows application under Wine (Direct3D 11)
        - SteamVR / OpenVR game through OpenComposite
        - Native macOS application (Metal)
        - metalvrd / headset streaming
        - Build or tests
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MetalVR version
      description: The commit (`git rev-parse --short HEAD`) or the release.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: MacBook Pro M3 Max, macOS 15.2
    validations:
      required: true
  - type: input
    id: wine
    attributes:
      label: Wine and Mullion
      description: For the Wine paths. `wine --version`, the Mullion version, and the graphics lane (`GRAPHICS_BACKEND`).
      placeholder: MetalSharp-Wine 7.0 (x86_64), Mullion 39d1e4a4, GRAPHICS_BACKEND=dxmt
  - type: input
    id: headset
    attributes:
      label: Headset and client
      description: For streaming. The headset, the ALVR client version, and USB or Wi-Fi.
      placeholder: Quest 3, ALVR client v20.14.1, Wi-Fi
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        `metalvrd --verbose` output, and the application's output with `METALVR_LOG=1`. For the ALVR driver also `session_log.txt` from its config directory; for an OpenVR game also `opencomposite.log`.
        Remove personal paths and names first.
      render: text
